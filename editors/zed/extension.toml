id = "iron-lsp"
name = "Iron LSP"
version = "0.6.0"
schema_version = 1
authors = ["iron-lang"]
description = "Language support for the Iron programming language"
repository = "https://github.com/victorl2/iron-lang"

# src/lib.rs starts ironls; languages/iron/ holds the language config and
# tree-sitter queries.

[language_servers.iron-lsp]
name = "Iron LSP"
languages = ["Iron"]

# The ironls versions this extension works with. src/config.rs
# (COMPATIBLE_IRONLS) must agree; test/dev-load/extension_test.rs checks it.
[version_constraints]
ironls = ">= 4.0.0, < 5.0.0"

# Debugging (#312, #347): the `Iron` debug adapter runs `iron dap`, the
# adapter shared with VS Code and Neovim (src/debug.rs). Its launch
# configuration schema is debug_adapter_schemas/Iron.json.
[debug_adapters.Iron]

# The tree-sitter grammar lives in this repository. Zed clones it at `commit`
# and compiles grammars/tree-sitter/iron/src/parser.c, so the commit must
# contain the generated src/ (committed since the grammar PR for #347).
# Bump it whenever grammar.js changes.
[grammars.iron]
repository = "https://github.com/victorl2/iron-lang"
commit = "a3db4a8b49ead7bf21e37d5e3f23d470e3cac622"
path = "grammars/tree-sitter/iron"

# The ironls download: zed::download_file only reaches declared hosts and
# paths (Zed rejects the manifest when `path` is missing).
[[capabilities]]
kind = "download_file"
host = "github.com"
path = ["victorl2", "iron-lang", "**"]

# `ironls --version` for the compatibility check (any ironls path: the
# settings path, PATH or the download).
[[capabilities]]
kind = "process:exec"
command = "*"
args = ["--version"]
