# Iron language surface for Zed. Comments follow src/lexer/lexer.c:
#   `-- ...`   line comment
#   `/// ...`  doc comment
#   (no block comment form exists in Iron)
# The queries next to this file (highlights, brackets, indents, outline,
# textobjects) target grammars/tree-sitter/iron; highlights.scm is written by
# scripts/sync-editor-queries.sh.

name = "Iron"
grammar = "iron"
path_suffixes = ["iron"]
line_comments = ["-- ", "/// "]
autoclose_before = ";:.,=}])>\t\n "
word_characters = ["_"]
tab_size = 4
hard_tabs = false
# Zed offers a Debug entry next to a run button's task (through the iron
# debug locator) only for the debug adapters the language lists here.
debuggers = ["Iron"]

[[brackets]]
start = "{"
end = "}"
close = true
newline = true

[[brackets]]
start = "["
end = "]"
close = true
newline = true

[[brackets]]
start = "("
end = ")"
close = true
newline = true

[[brackets]]
start = "\""
end = "\""
close = true
newline = false
not_in = ["string", "comment"]
