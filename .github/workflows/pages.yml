name: Deploy Website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - 'docs/llms/**'
      - 'docs/language_definition.md'
      - 'docs/networking.md'
      - 'docs/guide.md'
      - 'docs/raylib.md'
      - 'docs/examples/**'
      - 'src/stdlib/*.iron'
      - 'scripts/build_llms.py'
      - 'scripts/build_reference.py'
      - 'scripts/templates/**'
      - 'scripts/install.sh'
      - 'scripts/install.ps1'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Inject release version
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "unreleased")
          sed -i "s/__IRON_VERSION__/${VERSION}/g" docs/site/index.html

      - name: Stage the installers at the site root
        run: |
          install -m 0755 scripts/install.sh docs/site/install.sh
          install -m 0644 scripts/install.ps1 docs/site/install.ps1

      - name: Install the Markdown renderer
        run: python3 -m pip install --quiet markdown

      - name: Render the reference manual as /docs/
        run: python3 scripts/build_reference.py --site docs/site

      - name: Generate llms.txt, llms-full.txt, and LLM markdown pages
        run: python3 scripts/build_llms.py --site docs/site

      - name: Validate site links and fragments
        run: python3 scripts/check_site.py docs/site

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
