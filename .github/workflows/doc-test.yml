name: Doc Test

# Lock against drift between the documentation and the compiler. Builds
# iron from source, then runs scripts/test_doc_examples.sh, which builds
# and runs every fenced ```iron block of docs/language_definition.md and
# docs/llms/iron.md, compares program output with the ```output blocks
# and checks that blocks marked doctest-expect-error fail with the given
# code. scripts/grammar_check.py then runs the manual's EBNF grammar over
# the fixture corpus.

on:
  push:
    branches: [main]
    paths:
      - 'docs/language_definition.md'
      - 'docs/llms/iron.md'
      - 'docs/examples/native_*.iron'
      - 'scripts/check_branding.py'
      - 'scripts/build_reference.py'
      - 'scripts/templates/**'
      - 'scripts/test_doc_examples.sh'
      - 'scripts/grammar_check.py'
      - 'tests/integration/v4/**'
      - 'tests/integration/v4-fail/**'
      - 'src/**'
      - 'CMakeLists.txt'
      - '.github/workflows/doc-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/language_definition.md'
      - 'docs/llms/iron.md'
      - 'docs/examples/native_*.iron'
      - 'scripts/check_branding.py'
      - 'scripts/build_reference.py'
      - 'scripts/templates/**'
      - 'scripts/test_doc_examples.sh'
      - 'scripts/grammar_check.py'
      - 'tests/integration/v4/**'
      - 'tests/integration/v4-fail/**'
      - 'src/**'
      - 'CMakeLists.txt'
      - '.github/workflows/doc-test.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  doc-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/toolchain

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libasound2-dev

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -G Ninja

      - name: Build iron
        run: cmake --build build

      - name: Verify iron binary
        run: |
          test -x ./build/iron || { echo "FAIL: ./build/iron missing"; exit 1; }
          ./build/iron --version

      - name: Run doc-test extractor against docs/language_definition.md
        run: |
          chmod +x scripts/test_doc_examples.sh
          bash scripts/test_doc_examples.sh ./build/iron

      - name: Run doc-test extractor against docs/llms/iron.md
        run: MD_FILE=docs/llms/iron.md bash scripts/test_doc_examples.sh ./build/iron

      - name: Check the manual's grammar against the fixture corpus
        run: python3 scripts/grammar_check.py --negative tests/integration/v4-fail

      - name: Render the reference manual as /docs/
        run: |
          python3 -m pip install --quiet markdown
          python3 scripts/build_reference.py --site docs/site

      - name: Execute featured native examples and verify output
        run: python3 scripts/check_branding.py --compiler ./build/iron
