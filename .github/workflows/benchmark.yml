name: Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      benchmark: ${{ steps.filter.outputs.benchmark }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            benchmark:
              - 'src/**'
              - 'tests/benchmarks/**'
              - 'CMakeLists.txt'
              - '.github/workflows/**'

  benchmark:
    needs: changes
    # Split into two groups per OS so the thread-heavy parallel_/concurrency_/spawn_
    # benchmarks run concurrently with the sequential ones on a separate runner.
    # This also prevents the parallel group from polluting sequential timings
    # by hammering the shared CPU mid-measurement.
    name: benchmark (${{ matrix.os }}, ${{ matrix.group }})
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-26]
        group: [sequential, parallel]
      fail-fast: false

    runs-on: ${{ matrix.os }}
    # Each corpus is intentionally measured once. This invocation gates
    # compilation, execution, timeouts, timing extraction, and correctness.
    # Per-benchmark max_ratio breaches are visible warnings because short
    # workloads vary too much across shared hosted runners to be a hard gate.
    # Do not add `--check-regression` here until it consumes these results and
    # uses an OS/architecture-specific rolling baseline: that mode currently
    # reruns the entire 30-sample corpus and reads the unscoped, stale
    # baselines/latest.json file.
    steps:
      - name: Skip for docs-only changes
        if: needs.changes.outputs.benchmark != 'true'
        run: echo "No benchmark-relevant changes detected; skipping benchmark steps."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.benchmark == 'true'

      - name: Install dependencies (Linux)
        if: needs.changes.outputs.benchmark == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang python3 time

      - name: Install dependencies (macOS)
        if: needs.changes.outputs.benchmark == 'true' && runner.os == 'macOS'
        # Python's process-group launcher handles timeouts on both platforms;
        # no gtimeout/watchdog fallback is needed.
        run: brew install cmake ninja

      - name: Test benchmark process launcher
        if: needs.changes.outputs.benchmark == 'true'
        run: python3 tests/benchmarks/test_benchmark_process.py

      - name: Build compiler
        if: needs.changes.outputs.benchmark == 'true'
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -G Ninja
          cmake --build build

      - name: Run benchmarks
        if: needs.changes.outputs.benchmark == 'true'
        run: |
          if [ "${{ matrix.group }}" = "parallel" ]; then
            bash tests/benchmarks/run_benchmarks.sh --verbose --advisory-thresholds --only-parallel
          else
            bash tests/benchmarks/run_benchmarks.sh --verbose --advisory-thresholds --skip-parallel
          fi
