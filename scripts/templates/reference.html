<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} — Iron Language</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <link rel="alternate" type="text/markdown" href="{{LLMS}}" title="{{TITLE}} (Markdown)">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23e8590c'/%3E%3Ctext x='16' y='22' font-family='system-ui' font-weight='800' font-size='18' fill='white' text-anchor='middle'%3EFe%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-deep: #08080f;
      --bg-primary: #0c0c16;
      --bg-surface: #12121f;
      --bg-card: #181830;
      --bg-code: #0a0a14;
      --accent: #e8590c;
      --accent-hover: #ff6b1a;
      --text: #e2e8f0;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --border: #1e1e32;
      --border-light: #2a2a42;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
      --sidebar-width: 260px;

      --syn-kw: #e8590c;
      --syn-ty: #60a5fa;
      --syn-st: #4ade80;
      --syn-cm: #4a5568;
      --syn-fn: #fbbf24;
      --syn-nu: #c084fc;
      --syn-pr: #67e8f9;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-sans);
      background: var(--bg-deep);
      color: var(--text);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-hover); }

    /* ── Navigation ──────────────────────────────── */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      height: 56px;
      background: rgba(8, 8, 15, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 1.5rem;
      gap: 2rem;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 800;
      font-size: 1.1rem;
      color: var(--text);
      text-decoration: none;
      flex-shrink: 0;
    }

    .nav-logo-icon {
      width: 26px;
      height: 26px;
      background: var(--accent);
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 800;
      color: white;
    }

    .nav-right {
      margin-left: auto;
      display: flex;
      gap: 0.25rem;
      align-items: center;
    }

    .nav-right a {
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      transition: color 0.2s, background 0.2s;
      padding: 0.35rem 0.65rem;
      border-radius: 6px;
    }

    .nav-right a:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
    }

    .nav-right a.active-link {
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
    }

    .sidebar-toggle {
      display: none;
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-secondary);
      padding: 0.4rem 0.65rem;
      font-size: 0.8rem;
      cursor: pointer;
      font-family: var(--font-sans);
      font-weight: 500;
      transition: color 0.2s, border-color 0.2s;
    }

    .sidebar-toggle:hover {
      color: var(--text);
      border-color: var(--border-light);
    }

    .nav-hamburger {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.5rem;
      margin-left: auto;
    }

    .nav-hamburger span {
      display: block;
      width: 20px;
      height: 2px;
      background: var(--text-secondary);
      margin: 4px 0;
      transition: 0.3s;
      transform-origin: center;
    }

    .nav-hamburger.active span:nth-child(1) {
      transform: rotate(45deg) translate(4px, 4px);
    }

    .nav-hamburger.active span:nth-child(2) {
      opacity: 0;
    }

    .nav-hamburger.active span:nth-child(3) {
      transform: rotate(-45deg) translate(4px, -4px);
    }

    /* ── Overlays ───────────────────────────────── */
    .sidebar-overlay {
      position: fixed;
      inset: 0;
      z-index: 49;
      background: rgba(0, 0, 0, 0.5);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s, visibility 0.3s;
    }

    .sidebar-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .nav-overlay {
      position: fixed;
      inset: 0;
      z-index: 89;
      background: rgba(0, 0, 0, 0.4);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s, visibility 0.25s;
    }

    .nav-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    /* ── Layout ───────────────────────────────────── */
    .docs-layout {
      display: flex;
      padding-top: 56px;
    }

    /* ── Sidebar ──────────────────────────────────── */
    .sidebar {
      position: fixed;
      top: 56px;
      left: 0;
      bottom: 0;
      width: var(--sidebar-width);
      background: var(--bg-primary);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 1.5rem 0;
      scrollbar-width: thin;
      scrollbar-color: var(--border-light) transparent;
    }

    .sidebar::-webkit-scrollbar { width: 5px; }
    .sidebar::-webkit-scrollbar-track { background: transparent; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }

    .sidebar-section {
      margin-bottom: 1.5rem;
    }

    .sidebar-section h3 {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      padding: 0 1.5rem;
      margin-bottom: 0.5rem;
    }

    .sidebar-section a {
      display: block;
      padding: 0.3rem 1.5rem;
      font-size: 0.85rem;
      color: var(--text-secondary);
      transition: all 0.15s;
      border-left: 2px solid transparent;
    }

    .sidebar-section a:hover {
      color: var(--text);
      background: var(--bg-surface);
    }

    .sidebar-section a.active {
      color: var(--accent);
      border-left-color: var(--accent);
      background: var(--accent-subtle, rgba(232, 89, 12, 0.06));
    }

    /* ── Content ──────────────────────────────────── */
    .content {
      margin-left: var(--sidebar-width);
      flex: 1;
      min-width: 0;
      padding: 3rem 4rem 6rem;
      max-width: 900px;
      overflow-wrap: break-word;
    }

    .content h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 0.5rem;
    }

    .content > .subtitle {
      font-size: 1.1rem;
      color: var(--text-secondary);
      margin-bottom: 3rem;
    }

    .content h2 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-top: 4rem;
      margin-bottom: 1rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }

    .content h2:first-of-type {
      border-top: none;
      padding-top: 0;
      margin-top: 2rem;
    }

    .content h3 {
      font-size: 1.15rem;
      font-weight: 600;
      margin-top: 2rem;
      margin-bottom: 0.75rem;
    }

    .content h4 {
      font-size: 0.95rem;
      font-weight: 600;
      margin-top: 1.5rem;
      margin-bottom: 0.5rem;
      color: var(--text);
    }

    .content p {
      margin-bottom: 1rem;
      color: var(--text-secondary);
    }

    .content ul, .content ol {
      margin-bottom: 1rem;
      padding-left: 1.5rem;
    }

    .content li {
      color: var(--text-secondary);
      margin-bottom: 0.35rem;
    }

    .content code {
      font-family: var(--font-mono);
      font-size: 0.85em;
      background: var(--bg-surface);
      padding: 0.15em 0.4em;
      border-radius: 4px;
      color: var(--accent);
    }

    .content strong { color: var(--text); }

    /* Code blocks */
    .code-block {
      background: var(--bg-code);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }

    .code-block pre {
      padding: 1.25rem 1.5rem;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      line-height: 1.7;
      color: var(--text);
      white-space: pre;
      margin: 0;
    }

    .kw { color: var(--syn-kw); font-weight: 500; }
    .ty { color: var(--syn-ty); }
    .st { color: var(--syn-st); }
    .cm { color: var(--syn-cm); font-style: italic; }
    .fn { color: var(--syn-fn); }
    .nu { color: var(--syn-nu); }
    .pr { color: var(--syn-pr); }

    /* Tables */
    .doc-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }

    .doc-table th {
      text-align: left;
      padding: 0.6rem 1rem;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      font-weight: 600;
      font-size: 0.8rem;
      color: var(--text);
    }

    .doc-table td {
      padding: 0.5rem 1rem;
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }

    .doc-table code {
      background: none;
      padding: 0;
      color: var(--accent);
    }

    /* Callout */
    .callout {
      background: var(--bg-surface);
      border-left: 3px solid var(--accent);
      padding: 1rem 1.25rem;
      border-radius: 0 8px 8px 0;
      margin-bottom: 1.5rem;
    }

    .callout p { margin: 0; color: var(--text-secondary); font-size: 0.92rem; }

    /* ── Table overflow on mobile ────────────────── */
    .content .doc-table {
      display: block;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* ── Responsive ──────────────────────────────── */
    @media (max-width: 900px) {
      .sidebar {
        transform: translateX(-100%);
        transition: transform 0.3s ease;
        z-index: 50;
        box-shadow: none;
        width: 280px;
      }
      .sidebar.open {
        transform: translateX(0);
        box-shadow: 4px 0 24px rgba(0, 0, 0, 0.3);
      }
      .content {
        margin-left: 0;
        padding: 2rem 2rem 4rem;
        max-width: 100%;
        overflow-x: hidden;
      }
      .sidebar-toggle { display: block; }
      .content h1 { font-size: 2rem; }
      .content h2 { font-size: 1.3rem; }
    }

    @media (max-width: 640px) {
      .nav-right {
        position: absolute;
        top: 56px;
        left: 0;
        right: 0;
        flex-direction: column;
        background: rgba(12, 12, 22, 0.98);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid var(--border);
        padding: 0.75rem 1.5rem;
        gap: 0;
        opacity: 0;
        visibility: hidden;
        transform: translateY(-8px);
        transition: opacity 0.25s, visibility 0.25s, transform 0.25s;
      }
      .nav-right.open {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }
      .nav-right a {
        padding: 0.6rem 0.5rem;
        font-size: 0.95rem;
        min-height: 44px;
        display: flex;
        align-items: center;
        border-radius: 8px;
      }
      .nav-right a:hover {
        background: rgba(255, 255, 255, 0.04);
      }
      .nav-hamburger { display: block; }
      .content {
        padding: 1.75rem 1.25rem 3rem;
      }
      .content h1 { font-size: 1.75rem; }
      .content h2 { font-size: 1.2rem; margin-top: 3rem; }
      .content h3 { font-size: 1.05rem; }
      .code-block pre {
        font-size: 0.75rem;
        padding: 1rem;
      }
      nav { padding: 0 1rem; }
      .sidebar { width: 85vw; max-width: 300px; }
      .sidebar-section a {
        padding: 0.45rem 1.5rem;
        min-height: 40px;
        display: flex;
        align-items: center;
      }
    }

    @media (max-width: 480px) {
      .content {
        padding: 1.25rem 1rem 2.5rem;
      }
      .content h1 { font-size: 1.5rem; }
      .content h2 { font-size: 1.1rem; margin-top: 2.5rem; }
      .content h3 { font-size: 1rem; }
      .content p { font-size: 0.92rem; }
      .content li { font-size: 0.92rem; }
      .code-block pre {
        font-size: 0.7rem;
        padding: 0.85rem;
        line-height: 1.6;
      }
      .doc-table th, .doc-table td {
        padding: 0.45rem 0.65rem;
        font-size: 0.8rem;
      }
      .doc-table th { font-size: 0.72rem; }
      .callout { padding: 0.85rem 1rem; }
      .callout p { font-size: 0.88rem; }
      nav { padding: 0 0.75rem; }
      .sidebar-toggle { font-size: 0.75rem; padding: 0.35rem 0.55rem; }
    }

    @media (max-width: 360px) {
      .content { padding: 1rem 0.75rem 2rem; }
      .content h1 { font-size: 1.35rem; }
      .code-block pre { font-size: 0.65rem; padding: 0.75rem; }
    }

    /* Labels for non-Iron fences rendered from the manual. */
    .code-block[data-lang="output"], .code-block[data-lang="text"],
    .code-block[data-lang="toml"], .code-block[data-lang="ebnf"] { position: relative; }
    .code-block[data-lang]::before {
      content: attr(data-lang);
      position: absolute; top: 0.4rem; right: 0.75rem;
      font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--text-muted);
    }
    .code-block[data-lang="iron"]::before { content: none; }
    .content .code-block + .code-block[data-lang="output"] { margin-top: -0.75rem; }
    .content h4 { margin-top: 1.5rem; }
    .content hr { border: 0; border-top: 1px solid var(--border); margin: 2.5rem 0; }
    .content em { color: var(--text-secondary); }
    .content li > p { margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <!-- ── Navigation ──────────────────────────── -->
  <nav>
    <button class="sidebar-toggle" id="sidebarToggle">Menu</button>
    <a href="/" class="nav-logo">
      <div class="nav-logo-icon">Fe</div>
      Iron
    </a>
    <div class="nav-right" id="navRight">
      <a href="/">Home</a>
      <a href="/networking/">Networking</a>
      <a href="/guide/">Projects</a>
      <a href="/raylib/">Raylib</a>
      <a href="/lsp/">LSP</a>
      <a href="/install/">Install</a>
      <a href="https://github.com/victorl2/iron-lang">Source Code</a>
    </div>
    <button class="nav-hamburger" id="navToggle" aria-label="Toggle menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </nav>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="nav-overlay" id="navOverlay"></div>

  <div class="docs-layout">
    <!-- ── Sidebar ──────────────────────────────── -->
    <!-- ── Sidebar ──────────────────────────────── -->
    <aside class="sidebar" id="sidebar">
{{SIDEBAR}}
    </aside>

    <!-- ── Content ──────────────────────────────── -->
    <main class="content">
      <div class="callout">
        <p>{{CALLOUT}}</p>
      </div>
{{CONTENT}}
    </main>
  </div>

  <script>
    (function() {
      var sidebar = document.getElementById('sidebar');
      var sidebarToggle = document.getElementById('sidebarToggle');
      var sidebarOverlay = document.getElementById('sidebarOverlay');
      var navToggle = document.getElementById('navToggle');
      var navRight = document.getElementById('navRight');
      var navOverlay = document.getElementById('navOverlay');

      // Sidebar toggle
      function closeSidebar() {
        sidebar.classList.remove('open');
        sidebarOverlay.classList.remove('active');
      }

      sidebarToggle.addEventListener('click', function() {
        var isOpen = sidebar.classList.toggle('open');
        sidebarOverlay.classList.toggle('active');
      });

      sidebarOverlay.addEventListener('click', closeSidebar);

      document.querySelectorAll('.sidebar a').forEach(function(link) {
        link.addEventListener('click', closeSidebar);
      });

      // Nav hamburger toggle
      function closeNav() {
        navRight.classList.remove('open');
        navToggle.classList.remove('active');
        navOverlay.classList.remove('active');
      }

      navToggle.addEventListener('click', function() {
        var isOpen = navRight.classList.toggle('open');
        navToggle.classList.toggle('active');
        navOverlay.classList.toggle('active');
      });

      navOverlay.addEventListener('click', closeNav);

      navRight.querySelectorAll('a').forEach(function(a) {
        a.addEventListener('click', closeNav);
      });

      // Escape key closes both
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          closeSidebar();
          closeNav();
        }
      });

      // Highlight active sidebar link on scroll
      var sections = document.querySelectorAll('.content h2[id], .content h3[id]');
      var sidebarLinks = document.querySelectorAll('.sidebar a');

      function updateActive() {
        var scrollPos = window.scrollY + 80;
        var current = '';
        sections.forEach(function(section) {
          if (section.offsetTop <= scrollPos) {
            current = section.id;
          }
        });
        sidebarLinks.forEach(function(link) {
          link.classList.remove('active');
          if (link.getAttribute('href') === '#' + current) {
            link.classList.add('active');
          }
        });
      }

      window.addEventListener('scroll', updateActive);
      updateActive();
    })();
  </script>
</body>
</html>
